      font-size="48"
      font-weight="900"
      letter-spacing="3">鹏泉</text>
  </g>

  <path d="M14 57h116" fill="none" stroke="#0b77b6" stroke-width="5" stroke-linecap="round"/>
  <path d="M25 62h104" fill="none" stroke="#d7e6ed" stroke-width="1.6" stroke-linecap="round"/>

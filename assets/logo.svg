<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 138 72" role="img" aria-labelledby="title desc">
  <title id="title">鹏泉中文标志</title>
  <desc id="desc">紧凑型鹏泉中文字体标志，无图标和给排水科技文字</desc>
  <defs>
